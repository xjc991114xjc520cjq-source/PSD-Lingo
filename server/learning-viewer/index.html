<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:"><title>PSD Lingo 学习记录访问器</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>学习记录访问器</h1><p>对照修改邻域的原稿、仅替换文案与最终排版</p></div><button id="logout" hidden>退出登录</button></header><form id="login"><label>邮箱<input id="email" type="email" value="1498224542@qq.com" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="off"></label><button>登录查看</button></form><p id="message" role="status">完整案例包含实际文案与局部图片；北京时间 00:00 起归档私有 GitHub。</p><main id="workspace" hidden><aside><label>记录类型<select id="mode"><option value="cases">完整图文案例</option><option value="records">旧版参数摘要（保留 7 天）</option></select></label><div class="tools"><button id="refresh">刷新最新</button><button id="more">加载更早</button></div><label>筛选已加载记录<input id="filter" placeholder="设备、语言、图层或容器 ID"></label><p id="count"></p><div id="list"></div></aside><article><button id="exportCase" hidden>导出完整参考文档</button><h2 id="title">选择一条记录</h2><p id="meta">左侧选择记录，比较三阶段排版。</p><div id="stages"></div><div id="differences"></div><details><summary>结构化参考数据</summary><pre id="raw"></pre></details></article></main><script src="app.js"></script></body></html>
